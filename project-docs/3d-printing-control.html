<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🖨️ 3D Printing Manufacturing Control System | Portfolio</title>
                <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-card: rgba(255, 255, 255, 0.8);
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --accent-primary: #003366;
            --accent-secondary: #003366;
            --border-light: rgba(0, 51, 102, 0.2);
            --shadow-medium: rgba(0, 0, 0, 0.1);
        }

        [data-theme="light"] {
            --bg-primary: #f5fffb;
            --bg-secondary: #ebfff8;
            --bg-tertiary: rgba(0, 112, 255, 0.05);
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-hover: #ffffff;
            --text-primary: #0044cc;
            --text-secondary: #0055ff;
            --text-tertiary: #172a45;
            --text-light: #0070ff;
            --text-white: #ffffff;
            --accent-primary: #0070ff;
            --accent-secondary: #00c2ff;
            --accent-tertiary: #64ffda;
            --accent-light: #cce3ff;
            --border-light: rgba(0, 112, 255, 0.15);
            --shadow-medium: rgba(0, 112, 255, 0.12);
            --toggle-track-bg: rgba(0, 112, 255, 0.1);
            --toggle-border: rgba(0, 112, 255, 0.3);
            --toggle-thumb-bg: #0070ff;
        }

        [data-theme="dark"] {
            --bg-primary: #0a192f;
            --bg-secondary: #172a45;
            --bg-tertiary: rgba(100, 255, 218, 0.05);
            --bg-card: rgba(29, 53, 87, 0.9);
            --text-primary: #e6f1ff;
            --text-secondary: #a8b2d1;
            --text-tertiary: #8892b0;
            --text-light: #64ffda;
            --text-white: #ffffff;
            --accent-primary: #64ffda;
            --accent-secondary: #00bfa5;
            --accent-tertiary: #60A5FA;
            --accent-light: #93C5FD;
            --border-light: rgba(100, 255, 218, 0.15);
            --shadow-medium: rgba(2, 12, 27, 0.7);
            --toggle-track-bg: rgba(100, 255, 218, 0.1);
            --toggle-border: rgba(100, 255, 218, 0.3);
            --toggle-thumb-bg: #64ffda;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: background 0.3s ease; line-height: 1.7; padding: 60px 20px; }
        .container { max-width: 950px; margin: 0 auto; background: var(--bg-card); border-radius: 28px; padding: 80px 70px; box-shadow: 0 40px 100px var(--shadow-medium); border: 1px solid var(--border-light); backdrop-filter: blur(15px); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 70px; padding-bottom: 40px; border-bottom: 2px solid var(--border-light); }
        .header-controls { display: flex; align-items: center; gap: 20px; flex-wrap: nowrap; white-space: nowrap; }
        
        h1 { font-size: 3rem; font-weight: 800; color: var(--text-primary); margin: 0; line-height: 1.1; }
        .subtitle { font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 5px; color: var(--accent-primary); margin-top: 15px; }
        
        .btn-icon { background: var(--bg-secondary); border: 1px solid var(--border-light); width: 55px; height: 55px; border-radius: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--accent-primary); transition: all 0.3s ease; font-size: 1.4rem; }
        .btn-icon:hover { transform: scale(1.1); background: var(--accent-primary); color: var(--bg-primary); }
        .theme-toggle { position: relative; background: var(--bg-secondary); border: 1px solid var(--border-light); cursor: pointer; width: 45px; height: 45px; border-radius: 12px; transition: all 0.3s ease; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .theme-toggle-track { width: 56px; height: 28px; background: var(--toggle-track-bg); border-radius: 50px; border: 1px solid var(--toggle-border); position: relative; display: flex; align-items: center; padding: 0 4px; transition: all 0.3s ease; }
        .theme-toggle-thumb { width: 22px; height: 22px; background: var(--toggle-thumb-bg); border-radius: 50%; position: absolute; left: 3px; display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); }
        .theme-icon { font-size: 12px; line-height: 1; }
        [data-theme="dark"] .theme-toggle-thumb { transform: translateX(28px); }
        
        .back-link { text-decoration: none; padding: 15px 30px; background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: 18px; color: var(--accent-primary); font-weight: 700; font-size: 1rem; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
        .back-link:hover { transform: translateX(-8px); background: var(--accent-primary); color: var(--bg-primary); }
        .content-section { margin-bottom: 120px; padding-top: 20px; }
        .section-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 35px; color: var(--accent-primary); border-bottom: 2px solid var(--accent-primary); padding-bottom: 10px; display: flex; align-items: center; gap: 20px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }
        .section-content { font-size: 1.15rem; color: var(--text-secondary); line-height: 1.8; }
        .section-content p { margin-bottom: 25px; }
        .mechanism-image { width: 100%; border-radius: 20px; border: 1px solid var(--border-light); box-shadow: 0 30px 60px var(--shadow-medium); margin: 30px 0; display: block; }
        .card { background: var(--bg-secondary); padding: 35px; border-radius: 20px; margin: 30px 0; border: 1px solid var(--border-light); }
        @media (max-width: 768px) { .container { padding: 40px 20px; } h1 { font-size: 2.2rem; } .header { flex-direction: column; text-align: center; gap: 30px; } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>🖨️ 3D Printing Manufacturing Control System</h1>
                <p class="subtitle">Software Case Study</p>
            </div>
            <div class="header-controls">
                <button id="theme-toggle" class="theme-toggle" title="Toggle dark/light mode">
                    <div class="theme-toggle-track">
                        <div class="theme-toggle-thumb">
                            <span class="theme-icon">🌙</span>
                        </div>
                    </div>
                </button>
                <a href="../" class="back-link">← BACK</a>
            </div>
        </header>

        <main></main>

        
    </div>
            <script>
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        function updateToggleIcon() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const toggleBtn = document.getElementById('theme-toggle');
            if (toggleBtn) toggleBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        }
        
        updateToggleIcon();
        
        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateToggleIcon();
            });
        }
    </script>
</body>
</html>
